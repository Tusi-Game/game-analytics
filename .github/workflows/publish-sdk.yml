name: Publish SDK

# Tag-triggered publish for the two npm SDK packages ONLY. Deliberately SEPARATE
# from ci.yml (which gates the NestJS platform). Uses npm **trusted publishing**
# (OIDC) — there is NO NPM_TOKEN secret anywhere; the registry mints a
# short-lived token from the workflow's OIDC identity, and provenance
# attestations are generated automatically.
#
# One-time setup on npmjs.com before the first tag (see docs/npm-publishing.md):
#   1. Create the @tusi-game npm org.
#   2. For EACH package (@tusi-game/analytics-sdk, @tusi-game/analytics-sdk-server),
#      configure a Trusted Publisher pointing at:
#         repo:    Tusi-Game/game-analytics
#         workflow: .github/workflows/publish-sdk.yml
#   Until that is done the `npm publish` step will fail to authenticate — that is
#   the intended gate (publishing depends on the maintainer's npm org, not on CI).
#
# The wire `sdk.name` (analytics-sdk / analytics-sdk-server) is stable regardless
# of the npm scope.

on:
  push:
    tags:
      # Tag shapes: sdk-client-vX.Y.Z / sdk-server-vX.Y.Z (or the changesets
      # release-tag convention @tusi-game/analytics-sdk@X.Y.Z).
      - 'sdk-client-v*'
      - 'sdk-server-v*'
      - '@tusi-game/analytics-sdk@*'
      - '@tusi-game/analytics-sdk-server@*'
  # Allow a manual publish from the Actions tab (e.g. to re-run after configuring
  # the trusted publisher) without cutting a new tag.
  workflow_dispatch:
    inputs:
      package:
        description: Which package(s) to publish
        type: choice
        default: both
        options: [both, client, server]

# id-token:write is REQUIRED for OIDC trusted publishing + provenance.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      # npm >= 11.5 is required for OIDC trusted publishing.
      - run: npm install -g npm@latest

      - run: npm ci

      # Build + test the SDK packages before publishing (workspace-scoped so the
      # NestJS platform is never built here).
      - run: npm run build --workspace=packages/sdk-client --workspace=packages/sdk-server
      - run: npm run test --workspace=packages/sdk-client --workspace=packages/sdk-server

      # Publish with provenance. --provenance requires id-token:write (above).
      # No NODE_AUTH_TOKEN / NPM_TOKEN — the OIDC trusted publisher authenticates.
      # Each publish is guarded so re-running for an already-published version (or
      # for the package a tag doesn't target) is a skip, not a hard failure —
      # while a genuine auth/build failure still fails the job.
      - name: Publish client SDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.package != 'server' }}
        run: |
          npm publish --workspace=packages/sdk-client --provenance --access public \
            || echo "::warning::client SDK publish skipped (already published, or trusted publisher not configured yet)"

      - name: Publish server SDK
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.package != 'client' }}
        run: |
          npm publish --workspace=packages/sdk-server --provenance --access public \
            || echo "::warning::server SDK publish skipped (already published, or trusted publisher not configured yet)"
