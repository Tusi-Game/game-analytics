name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U analytics"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # NOTE: MinIO is NOT a service container. The official minio/minio image
      # needs a `server /data` command, which GitHub service containers can't
      # supply, so it is started as an explicit `docker run` step below (same
      # digest-pinned image as docker-compose.yml).

    env:
      NODE_ENV: test
      PORT: '3000'
      REPORTING_OFFSET: '0'
      DB_HOST: localhost
      DB_PORT: '5432'
      DB_USER: analytics
      DB_PASSWORD: analytics
      DB_NAME: analytics
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MINIO_S3_ENDPOINT: 'http://localhost:9000'
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: analytics-raw

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

      # Start MinIO (S3-compatible) for the cold-storage (008) conformance suite.
      # Run as a plain container so the `server /data` command can be passed —
      # the same digest-pinned image docker-compose.yml uses.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              echo "MinIO is up"; exit 0
            fi
            echo "waiting for MinIO ($i)..."; sleep 2
          done
          echo "MinIO did not become ready in time" >&2
          docker logs minio || true
          exit 1

      - run: npm run test
      - run: npm run test:e2e
      - run: npm run build
